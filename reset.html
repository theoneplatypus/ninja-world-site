<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NINJA WORLD — Set a new password</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#06131F; --panel:#0B1D2E; --line:#2E6E9E; --glow:#5FB8EE; --text:#DDEBF7; --dim:#7E9BB5; --bad:#E5484D; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); padding:24px; }
  h1 { color:var(--glow); letter-spacing:3px; font-size:20px; margin:0 0 4px; }
  p { color:var(--dim); font-size:14px; line-height:1.5; }
  label { display:block; font-size:12px; color:var(--dim); margin:14px 0 4px; letter-spacing:1px; }
  input { width:100%; padding:12px; background:#04121B; border:1px solid var(--line); color:var(--text); font-size:16px; }
  button { margin-top:18px; width:100%; padding:12px; background:transparent; border:1px solid var(--glow); color:var(--text); font-weight:800; letter-spacing:2px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; }
  .msg { margin-top:14px; font-size:14px; }
  .bad { color:var(--bad); }
  .show { font-size:12px; color:var(--glow); cursor:pointer; margin-top:6px; display:inline-block; }
</style>
</head>
<body>
<div class="card">
  <h1>NINJA WORLD</h1>
  <p id="lead">Checking your reset link…</p>
  <form id="f" hidden>
    <label for="p1">NEW PASSWORD</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="6" required>
    <label for="p2">RETYPE PASSWORD</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="6" required>
    <span class="show" id="show">show</span>
    <button id="go" type="submit">SET PASSWORD</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // v2.5.4. The anon key is the same public key the web game ships; it can
  // do nothing but what the signed-in reset session allows.
  const sb = supabase.createClient("https://gdetfjbdrrlxbscaynik.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkZXRmamJkcnJseGJzY2F5bmlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTM3NzAsImV4cCI6MjEwMDM4OTc3MH0.Po1EefCL2GdRoTqrxg0YsmNWQtq1J6fnPtduMxzZ0s8", { auth: { detectSessionInUrl: true, persistSession: false } });
  const $ = (id) => document.getElementById(id);
  const ready = () => { $("lead").textContent = "Choose a new password for your ninja."; $("f").hidden = false; };
  const dead = () => { $("lead").innerHTML = "This link has expired or was already used. Open NINJA WORLD, tap <b>Forgot password?</b> and send a new one."; };
  sb.auth.onAuthStateChange((ev, session) => { if (ev === "PASSWORD_RECOVERY" || session) ready(); });
  setTimeout(async () => { const { data } = await sb.auth.getSession(); if (data.session) ready(); else if ($("f").hidden) dead(); }, 1500);
  $("show").onclick = () => { const t = $("p1").type === "password" ? "text" : "password"; $("p1").type = t; $("p2").type = t; $("show").textContent = t === "text" ? "hide" : "show"; };
  $("f").onsubmit = async (e) => {
    e.preventDefault();
    const a = $("p1").value, b = $("p2").value;
    $("msg").className = "msg bad";
    if (a.length < 6) { $("msg").textContent = "At least 6 characters."; return; }
    if (a !== b) { $("msg").textContent = "Passwords don't match."; return; }
    $("go").disabled = true;
    const { error } = await sb.auth.updateUser({ password: a });
    $("go").disabled = false;
    if (error) { $("msg").textContent = "Could not set it: " + error.message; return; }
    $("f").hidden = true;
    $("lead").textContent = "Done. Open NINJA WORLD and log in with your ninja name and the new password.";
    $("msg").textContent = "";
    await sb.auth.signOut();
  };
</script>
</body>
</html>
